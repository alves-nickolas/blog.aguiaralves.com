<ul>
    {% for post in site.posts limit: 5 %}
        {% unless post.url == page.url %}
            {% assign common_tags = post.tags | intersection: page.tags %}
            {% if common_tags.size > 0 %}
                <li>{% include print_shortpost.html post=post %}</li>
            {% endif %}
        {% endunless %}
    {% endfor %}
</ul>
